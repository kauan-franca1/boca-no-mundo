<!doctype html><style>body{margin:0;background:#333;overflow:hidden}iframe{border:0;transform-origin:0 0;background:#fff}</style>
<iframe id=f src="/site"></iframe><script>
window.setSize=(w,h)=>{const f=document.getElementById('f');f.width=w;f.height=h;const s=Math.min(innerWidth/w,innerHeight/h);f.style.transform='scale('+s+')';return s};
window.W=()=>document.getElementById('f').contentWindow;
setSize(1280,800);
</script>
